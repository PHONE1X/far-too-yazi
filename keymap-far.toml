# =====================================================================
# far-too-yazi -- FAR Manager keymap  ("far" mode)
#
# This file is one half of the pair swapped by the far-mode plugin;
# keymap.toml is a symlink pointing at either this file or
# keymap-vim.toml. Switch with Alt+M (the plugin swaps the symlink and
# the `y` shell wrapper relaunches yazi, restoring tabs, panes and the
# preview pane).
#
# Layout follows FAR Manager 3.x. Where yazi has no equivalent, the
# closest honest approximation is used and marked "(approx)".
# Deliberate departures from FAR:
#   * Left/Right arrows leave/enter directories. FAR uses them to move
#     between columns; yazi's list is single-column, so they are free
#     and far too useful to waste.
#   * Alt+<letter> is a plugin prefix here (Alt+G jumps, Alt+C copy
#     path, ...). In FAR it starts quick search -- that lives on "/".
#   * Vim motions (hjkl, y/x/p/d, v, n/N) are NOT bound. That is the
#     point of this mode. Everything is reachable from F-keys, arrows,
#     Alt/Ctrl combos, or the F2/F9 menus.
# =====================================================================
[mgr]
keymap = [
	# ------------------------- Leaving ---------------------------
	{ on = "<F10>",  run = "quit",               desc = "Quit" },
	{ on = "<Esc>",  run = "escape",             desc = "Cancel search / filter / selection" },
	{ on = "<C-[>",  run = "escape",             desc = "Cancel search / filter / selection" },
	{ on = "<C-o>",  run = "suspend",            desc = "Hide panels, drop to the shell (fg to come back)" },
	{ on = "<C-z>",  run = "suspend",            desc = "Suspend the process" },
	{ on = "Q",      run = "quit --no-cwd-file", desc = "Quit without writing the cwd-file" },

	# ------------------------- Movement --------------------------
	{ on = "<Up>",         run = "arrow prev",  desc = "Previous file" },
	{ on = "<Down>",       run = "arrow next",  desc = "Next file" },
	{ on = "<PageUp>",     run = "arrow -100%", desc = "Page up" },
	{ on = "<PageDown>",   run = "arrow 100%",  desc = "Page down" },
	{ on = "<S-PageUp>",   run = "arrow -50%",  desc = "Half page up" },
	{ on = "<S-PageDown>", run = "arrow 50%",   desc = "Half page down" },
	{ on = "<Home>",       run = "arrow top",   desc = "Go to top" },
	{ on = "<End>",        run = "arrow bot",   desc = "Go to bottom" },

	# ------------------------ Navigation -------------------------
	{ on = "<Enter>",      run = "plugin smart-enter", desc = "Enter the directory, or open the file" },
	{ on = "<Right>",      run = "plugin smart-enter", desc = "Enter the directory, or open the file" },
	{ on = "<C-PageDown>", run = "plugin smart-enter", desc = "Enter the directory (FAR: Ctrl+PgDn)" },
	{ on = "<Left>",       run = "leave",              desc = "Up to the parent directory" },
	{ on = "<C-PageUp>",   run = "leave",              desc = "Up to the parent directory (FAR: Ctrl+PgUp)" },
	{ on = "<Backspace>",  run = "leave",              desc = "Up to the parent directory" },
	{ on = '<C-\>',        run = "cd /",               desc = "Go to the root directory (FAR: Ctrl+\\)" },
	{ on = "<A-Left>",     run = "back",               desc = "Back to the previous directory" },
	{ on = "<A-Right>",    run = "forward",            desc = "Forward to the next directory" },

	# ------------------------ Selection --------------------------
	{ on = "<Insert>",   run = [ "toggle", "arrow next" ], desc = "Select / deselect and move down (FAR: Ins)" },
	{ on = "<S-Down>",   run = [ "toggle", "arrow next" ], desc = "Select and move down" },
	{ on = "<S-Up>",     run = [ "toggle", "arrow prev" ], desc = "Select and move up" },
	{ on = "+",          run = "toggle_all --state=on",    desc = "Select all (FAR: Gray +)" },
	{ on = "-",          run = "toggle_all --state=off",   desc = "Deselect all (FAR: Gray -)" },
	{ on = "*",          run = "toggle_all",               desc = "Invert selection (FAR: Gray *)" },

	# ------------------- The F-keys, as in FAR --------------------
	{ on = "<F1>",   run = "help",                          desc = "Help" },
	{ on = "<F2>",   run = "plugin far-menu user",          desc = "User menu" },
	{ on = "<F3>",   run = "spot",                          desc = "View the hovered file (read-only)" },
	{ on = "<S-F3>", run = "open --interactive",            desc = "View / open with... (chooser)" },
	{ on = "<F4>",   run = "open",                          desc = "Edit / open (your opener rules decide)" },
	{ on = "<S-F4>", run = "create",                        desc = "Create a new file" },
	{ on = "<F5>",   run = "plugin far-mode far_copy",      desc = "Copy to the other pane" },
	{ on = "<S-F5>", run = [ "yank", "paste" ],             desc = "Duplicate here" },
	{ on = "<F6>",   run = "plugin far-mode far_move",      desc = "Move to the other pane" },
	{ on = "<S-F6>", run = "rename --cursor=before_ext",    desc = "Rename" },

	# Same transfers as F5/F6, on Y/Ctrl+Y -- routed through the same
	# far-mode far_copy/far_move actions F5/F6 use (not called directly on
	# split-tabs), so these also get far_action's auto-activate-dual-pane
	# fallback if it's ever off, same as F5/F6 get.
	{ on = "Y",      run = "plugin far-mode far_move",      desc = "Move to the other pane" },
	{ on = "<C-y>",  run = "plugin far-mode far_copy",      desc = "Copy to the other pane" },
	{ on = "<F7>",   run = "create",                        desc = "Create a directory (end the name with /)" },
	{ on = "<F8>",   run = "remove",                        desc = "Delete to trash" },
	{ on = "<S-F8>", run = "remove --permanently",          desc = "Delete permanently (FAR: wipe)" },
	{ on = "<F9>",   run = "plugin far-menu main",          desc = "Main menu" },
	{ on = "<F11>",  run = "plugin far-menu plugins",       desc = "Plugin commands" },
	{ on = "<F12>",  run = "tasks:show",                    desc = "Task manager (approx: FAR's screens list)" },
	{ on = "<Delete>",   run = "remove",                    desc = "Delete to trash" },
	{ on = "<S-Delete>", run = "remove --permanently",      desc = "Delete permanently" },

	# Archives: FAR puts add/extract on Shift+F1 / Shift+F2.
	{ on = "<S-F1>", run = "plugin compress", desc = "Add selected files to an archive" },
	{ on = "<S-F2>", run = "open",            desc = "Extract archive (approx: via your opener rules)" },

	# -------------------- Alt+F-keys, as in FAR -------------------
	{ on = "<A-F1>",  run = "plugin mount",        desc = "Change drive (mount menu)" },
	{ on = "<A-F2>",  run = "plugin mount",        desc = "Change drive (mount menu)" },
	{ on = "<A-F7>",  run = "search --via=fd",     desc = "Find file by name (fd)" },
	{ on = "<S-F7>",  run = "search --via=rg",     desc = "Find file by content (ripgrep)" },
	{ on = "<C-s>",   run = "escape --search",     desc = "Cancel the running search" },
	{ on = "<A-F8>",  run = "plugin fzf",          desc = "Jump to a file (fzf)" },
	{ on = "<A-F10>", run = "plugin far-tree",     desc = "Find folder (directory tree)" },
	{ on = "<A-F12>", run = "plugin zoxide",       desc = "Folder history (zoxide)" },

	# --------------------------- Panels ---------------------------
	{ on = "<Tab>",   run = "plugin far-mode far_switch_pane", desc = "Switch to the other pane" },
	{ on = "<C-u>",   run = "tab_swap 1",                      desc = "Swap the panes" },
	{ on = "<C-p>",   run = "plugin split-tabs spl_toggle",    desc = "Show / hide the second pane" },
	{ on = "<C-F1>",  run = "plugin split-tabs spl_toggle",    desc = "Show / hide the second pane" },
	{ on = "<C-F2>",  run = "plugin split-tabs spl_toggle",    desc = "Show / hide the second pane" },
	{ on = "<C-q>",   run = "plugin far-mode far_preview",     desc = "Quick view panel (preview)" },
	{ on = "<A-PageUp>",   run = "seek -5", desc = "Scroll the preview up" },
	{ on = "<A-PageDown>", run = "seek 5",  desc = "Scroll the preview down" },

	# ------------------------ Panel modes -------------------------
	# FAR: Ctrl+1..Ctrl+5 switch the panel view mode.
	{ on = "<C-1>", run = "linemode none",        desc = "View mode: names only" },
	{ on = "<C-2>", run = "linemode size",        desc = "View mode: size" },
	{ on = "<C-3>", run = "linemode mtime",       desc = "View mode: modified time" },
	{ on = "<C-4>", run = "linemode btime",       desc = "View mode: created time" },
	{ on = "<C-5>", run = "linemode permissions", desc = "View mode: permissions" },
	{ on = "<C-6>", run = "linemode owner",       desc = "View mode: owner" },

	# --------------------------- Sorting --------------------------
	# FAR: Ctrl+F3..Ctrl+F9.
	{ on = "<C-F3>", run = "sort alphabetical --reverse=no",                 desc = "Sort by name" },
	{ on = "<C-F4>", run = "sort extension --reverse=no",                    desc = "Sort by extension" },
	{ on = "<C-F5>", run = [ "sort mtime --reverse=no", "linemode mtime" ],  desc = "Sort by modified time" },
	{ on = "<C-F6>", run = [ "sort size --reverse=no", "linemode size" ],    desc = "Sort by size" },
	{ on = "<C-F7>", run = "sort natural --reverse=no",                      desc = "Sort naturally" },
	{ on = "<C-F8>", run = [ "sort btime --reverse=no", "linemode btime" ],  desc = "Sort by creation time" },

	# ------------------------ Panel actions -----------------------
	{ on = "<C-a>", run = "plugin chmod",       desc = "File attributes (chmod)" },
	{ on = "<C-h>", run = "hidden toggle",      desc = "Show / hide hidden files" },
	{ on = "<C-i>", run = "filter --smart",     desc = "Filter the panel" },
	{ on = "<C-g>", run = "shell --interactive", desc = "Run a shell command" },
	{ on = "<C-e>", run = "shell --block --interactive", desc = "Run a shell command (block until it exits)" },
	{ on = "<C-r>", run = "cd .",               desc = "Reload the panel" },

	# ------------------------- Clipboard --------------------------
	# FAR/Windows muscle memory: Ctrl+Ins copies, Shift+Ins pastes.
	{ on = "<C-Insert>", run = [ "yank", 'plugin clipboard -- --action=copy' ], desc = "Copy to the clipboard" },
	{ on = "<S-Insert>", run = "plugin merge-paste",                            desc = "Paste (asks on name conflicts)" },
	{ on = "<A-Insert>", run = "yank --cut",                                    desc = "Cut" },
	{ on = "<A-u>",      run = "plugin restore",                                desc = "Undo the last delete" },

	# --------------------------- Search ---------------------------
	{ on = "/",     run = "find --smart",            desc = "Quick search" },
	{ on = "?",     run = "find --previous --smart", desc = "Quick search backwards" },
	{ on = "<C-n>", run = "find_arrow",              desc = "Next match" },
	{ on = "<A-n>", run = "find_arrow --previous",   desc = "Previous match" },

	# ---------------------------- Tabs ----------------------------
	# These briefly drove split-tabs' "workspace" layer. split-tabs has since
	# been reverted to upstream 00c3084, which has no workspace actions at all
	# -- its entry() silently ignored these arguments, so all four keys did
	# nothing. Restored to native yazi tab actions so the baseline is coherent;
	# re-point them if the workspace layer gets rebuilt.
	{ on = "<A-t>",     run = "tab_create --current",     desc = "New tab with CWD" },
	{ on = "<A-w>",     run = "close",                    desc = "Close the tab, or quit if it is the last" },
	{ on = "<C-Tab>",   run = "tab_switch 1 --relative",  desc = "Next tab" },
	{ on = "<C-S-Tab>", run = "tab_switch -1 --relative", desc = "Previous tab" },
	{ on = "<C-c>",     run = "close",                       desc = "Close the tab, or quit if it is the last" },

	# ------------------------ Goto (Alt+G) ------------------------
	{ on = [ "<A-g>", "h" ],       run = "cd ~",                     desc = "Home" },
	{ on = [ "<A-g>", "c" ],       run = "cd ~/.config",             desc = "~/.config" },
	{ on = [ "<A-g>", "d" ],       run = "cd ~/Downloads/",          desc = "~/Downloads" },
	{ on = [ "<A-g>", "w" ],       run = "cd ~/WORKSPASE/",          desc = "~/WORKSPASE" },
	{ on = [ "<A-g>", "g" ],       run = "cd ~/Games/",              desc = "~/Games" },
	{ on = [ "<A-g>", "m" ],       run = "cd /run/media/super/",     desc = "/run/media/super" },
	{ on = [ "<A-g>", "H" ],       run = "cd ~/.config/hypr",        desc = "~/.config/hypr" },
	{ on = [ "<A-g>", "C" ],       run = "cd ~/.config/hypr/custom", desc = "~/.config/hypr/custom" },
	{ on = [ "<A-g>", "y" ],       run = "cd ~/.config/hypr/hyprland/", desc = "~/.config/hypr/hyprland" },
	{ on = [ "<A-g>", "<Space>" ], run = "cd --interactive",         desc = "Jump interactively" },
	{ on = [ "<A-g>", "s" ],       run = "follow",                   desc = "Follow the hovered symlink" },

	# --------------------- Copy path (Alt+C) ----------------------
	{ on = [ "<A-c>", "c" ], run = "copy path",             desc = "Copy the full path" },
	{ on = [ "<A-c>", "d" ], run = "copy dirname",          desc = "Copy the directory path" },
	{ on = [ "<A-c>", "f" ], run = "copy filename",         desc = "Copy the file name" },
	{ on = [ "<A-c>", "n" ], run = "copy name_without_ext", desc = "Copy the file name without extension" },

	# ---------------------- Archives (Alt+A) ----------------------
	{ on = [ "<A-a>", "a" ], run = "plugin compress",     desc = "Archive selected files" },
	{ on = [ "<A-a>", "p" ], run = "plugin compress -p",  desc = "Archive (password)" },
	{ on = [ "<A-a>", "h" ], run = "plugin compress -ph", desc = "Archive (password + header)" },
	{ on = [ "<A-a>", "l" ], run = "plugin compress -l",  desc = "Archive (compression level)" },
	{ on = [ "<A-a>", "u" ], run = "plugin compress -phl", desc = "Archive (password + header + level)" },

	# -------------------- KDE Connect (Alt+K) ---------------------
	{ on = [ "<A-k>", "s" ], run = "plugin kdeconnect send",   desc = "Send files to the phone" },
	{ on = [ "<A-k>", "p" ], run = "plugin kdeconnect browse", desc = "Browse the phone" },

	# --------------------- Recycle bin (Alt+R) --------------------
	{ on = [ "<A-r>", "b" ], run = "plugin recycle-bin",              desc = "Recycle bin" },
	{ on = [ "<A-r>", "r" ], run = "plugin restore -- --interactive", desc = "Restore deleted files (interactive)" },

	# ------------------------- Mode switch ------------------------
	# By design, this is one-directional per mode: vim->far is "b f" (see
	# keymap-vim.toml), far->vim is Alt+M. No "b f" alias here on purpose.
	{ on = "<A-m>", run = "plugin far-mode to_vim", desc = "Switch back to the vim keymap (relaunches yazi)" },

	# ------------------- Restored from the pre-Phase-3 far keymap -----------------
	# These two were in the old file's [[mgr.prepend_keymap]] block, which got cut
	# when this file was rewritten for Phase 3 (the tail copy stopped short of it).
	# Everything else in that block was deliberately superseded by an F-key or
	# Alt-prefix binding above; these two were not, so they are restored here.
	{ on = "P", run = "plugin smart-paste",               desc = "Paste into the hovered directory or CWD" },
	{ on = "U", run = "plugin restore -- --interactive",  desc = "Restore deleted files (interactive)" },
]

[tasks]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Close task manager" },
	{ on = "<C-[>", run = "close", desc = "Close task manager" },
	{ on = "<C-c>", run = "close", desc = "Close task manager" },
	{ on = "w",     run = "close", desc = "Close task manager" },

	{ on = "k", run = "arrow prev", desc = "Previous task" },
	{ on = "j", run = "arrow next", desc = "Next task" },

	{ on = "<Up>",   run = "arrow prev", desc = "Previous task" },
	{ on = "<Down>", run = "arrow next", desc = "Next task" },

	{ on = "<Enter>", run = "inspect", desc = "Inspect the task" },
	{ on = "x",       run = "cancel",  desc = "Cancel the task" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[spot]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Close the spot" },
	{ on = "<C-[>", run = "close", desc = "Close the spot" },
	{ on = "<C-c>", run = "close", desc = "Close the spot" },
	{ on = "<Tab>", run = "close", desc = "Close the spot" },

	{ on = "k", run = "arrow prev", desc = "Previous line" },
	{ on = "j", run = "arrow next", desc = "Next line" },
	{ on = "h", run = "swipe prev", desc = "Swipe to previous file" },
	{ on = "l", run = "swipe next", desc = "Swipe to next file" },

	{ on = "<Up>",    run = "arrow prev", desc = "Previous line" },
	{ on = "<Down>",  run = "arrow next", desc = "Next line" },
	{ on = "<Left>",  run = "swipe prev", desc = "Swipe to previous file" },
	{ on = "<Right>", run = "swipe next", desc = "Swipe to next file" },

	# Copy
	{ on = [ "c", "c" ], run = "copy cell", desc = "Copy selected cell" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[pick]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "Cancel pick" },
	{ on = "<C-[>",   run = "close",          desc = "Cancel pick" },
	{ on = "<C-c>",   run = "close",          desc = "Cancel pick" },
	{ on = "<Enter>", run = "close --submit", desc = "Submit the pick" },

	{ on = "k", run = "arrow prev", desc = "Previous option" },
	{ on = "j", run = "arrow next", desc = "Next option" },

	{ on = "<Up>",   run = "arrow prev", desc = "Previous option" },
	{ on = "<Down>", run = "arrow next", desc = "Next option" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[input]

keymap = [
	{ on = "<C-c>",   run = "close",          desc = "Cancel input" },
	{ on = "<Enter>", run = "close --submit", desc = "Submit input" },
	{ on = "<Esc>",   run = "escape",         desc = "Back to normal mode, or cancel input" },
	{ on = "<C-[>",   run = "escape",         desc = "Back to normal mode, or cancel input" },

	# Mode
	{ on = "i", run = "insert",                          desc = "Enter insert mode" },
	{ on = "I", run = [ "move first-char", "insert" ],   desc = "Move to the BOL, and enter insert mode" },
	{ on = "a", run = "insert --append",                 desc = "Enter append mode" },
	{ on = "A", run = [ "move eol", "insert --append" ], desc = "Move to the EOL, and enter append mode" },
	{ on = "v", run = "visual",                          desc = "Enter visual mode" },
	{ on = "r", run = "replace",                         desc = "Replace a single character" },

	# Selection
	{ on = "V",     run = [ "move bol", "visual", "move eol" ], desc = "Select from BOL to EOL" },
	{ on = "<C-A>", run = [ "move eol", "visual", "move bol" ], desc = "Select from EOL to BOL" },
	{ on = "<C-E>", run = [ "move bol", "visual", "move eol" ], desc = "Select from BOL to EOL" },

	# Character-wise movement
	{ on = "h",       run = "move -1", desc = "Move back a character" },
	{ on = "l",       run = "move 1",  desc = "Move forward a character" },
	{ on = "<Left>",  run = "move -1", desc = "Move back a character" },
	{ on = "<Right>", run = "move 1",  desc = "Move forward a character" },
	{ on = "<C-b>",   run = "move -1", desc = "Move back a character" },
	{ on = "<C-f>",   run = "move 1",  desc = "Move forward a character" },

	# Word-wise movement
	{ on = "b",     run = "backward",                    desc = "Move back to the start of the current or previous word" },
	{ on = "B",     run = "backward --far",              desc = "Move back to the start of the current or previous WORD" },
	{ on = "w",     run = "forward",                     desc = "Move forward to the start of the next word" },
	{ on = "W",     run = "forward --far",               desc = "Move forward to the start of the next WORD" },
	{ on = "e",     run = "forward --end-of-word",       desc = "Move forward to the end of the current or next word" },
	{ on = "E",     run = "forward --far --end-of-word", desc = "Move forward to the end of the current or next WORD" },
	{ on = "<A-b>", run = "backward",                    desc = "Move back to the start of the current or previous word" },
	{ on = "<A-f>", run = "forward --end-of-word",       desc = "Move forward to the end of the current or next word" },

	# Line-wise movement
	{ on = "0",      run = "move bol",        desc = "Move to the BOL" },
	{ on = "$",      run = "move eol",        desc = "Move to the EOL" },
	{ on = "_",      run = "move first-char", desc = "Move to the first non-whitespace character" },
	{ on = "^",      run = "move first-char", desc = "Move to the first non-whitespace character" },
	{ on = "<C-a>",  run = "move bol",        desc = "Move to the BOL" },
	{ on = "<C-e>",  run = "move eol",        desc = "Move to the EOL" },
	{ on = "<Home>", run = "move bol",        desc = "Move to the BOL" },
	{ on = "<End>",  run = "move eol",        desc = "Move to the EOL" },

	# Delete
	{ on = "<Backspace>", run = "backspace",         desc = "Delete the character before the cursor" },
	{ on = "<Delete>",    run = "backspace --under", desc = "Delete the character under the cursor" },
	{ on = "<C-h>",       run = "backspace",         desc = "Delete the character before the cursor" },
	{ on = "<C-d>",       run = "backspace --under", desc = "Delete the character under the cursor" },

	# Kill
	{ on = "<C-u>", run = "kill bol",      desc = "Kill backwards to the BOL" },
	{ on = "<C-k>", run = "kill eol",      desc = "Kill forwards to the EOL" },
	{ on = "<C-w>", run = "kill backward", desc = "Kill backwards to the start of the current word" },
	{ on = "<A-d>", run = "kill forward",  desc = "Kill forwards to the end of the current word" },

	# Cut/Yank/Paste
	{ on = "d", run = "delete --cut",                                      desc = "Cut selected characters" },
	{ on = "D", run = [ "delete --cut", "move eol" ],                      desc = "Cut until EOL" },
	{ on = "c", run = "delete --cut --insert",                             desc = "Cut selected characters, and enter insert mode" },
	{ on = "C", run = [ "delete --cut --insert", "move eol" ],             desc = "Cut until EOL, and enter insert mode" },
	{ on = "s", run = [ "delete --cut --insert", "move 1" ],               desc = "Cut current character, and enter insert mode" },
	{ on = "S", run = [ "move bol", "delete --cut --insert", "move eol" ], desc = "Cut from BOL until EOL, and enter insert mode" },
	{ on = "x", run = [ "delete --cut", "move 1 --in-operating" ],         desc = "Cut current character" },
	{ on = "y", run = "yank",                                              desc = "Copy selected characters" },
	{ on = "p", run = "paste",                                             desc = "Paste copied characters after the cursor" },
	{ on = "P", run = "paste --before",                                    desc = "Paste copied characters before the cursor" },

	# Undo/Redo
	{ on = "u",     run = "undo", desc = "Undo the last operation" },
	{ on = "<C-r>", run = "redo", desc = "Redo the last operation" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[confirm]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "Cancel the confirm" },
	{ on = "<C-[>",   run = "close",          desc = "Cancel the confirm" },
	{ on = "<C-c>",   run = "close",          desc = "Cancel the confirm" },
	{ on = "<Enter>", run = "close --submit", desc = "Submit the confirm" },

	{ on = "n", run = "close",          desc = "Cancel the confirm" },
	{ on = "y", run = "close --submit", desc = "Submit the confirm" },

	{ on = "k", run = "arrow prev", desc = "Previous line" },
	{ on = "j", run = "arrow next", desc = "Next line" },

	{ on = "<Up>",   run = "arrow prev", desc = "Previous line" },
	{ on = "<Down>", run = "arrow next", desc = "Next line" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[cmp]

keymap = [
	{ on = "<C-c>",   run = "close",                                      desc = "Cancel completion" },
	{ on = "<Tab>",   run = "close --submit",                             desc = "Submit the completion" },
	{ on = "<Enter>", run = [ "close --submit", "input:close --submit" ], desc = "Complete and submit the input" },

	{ on = "<A-k>", run = "arrow prev", desc = "Previous item" },
	{ on = "<A-j>", run = "arrow next", desc = "Next item" },

	{ on = "<Up>",   run = "arrow prev", desc = "Previous item" },
	{ on = "<Down>", run = "arrow next", desc = "Next item" },

	{ on = "<C-p>", run = "arrow prev", desc = "Previous item" },
	{ on = "<C-n>", run = "arrow next", desc = "Next item" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "Clear the filter, or hide the help" },
	{ on = "<C-[>", run = "escape", desc = "Clear the filter, or hide the help" },
	{ on = "<C-c>", run = "close",  desc = "Hide the help" },

	# Navigation
	{ on = "k", run = "arrow prev", desc = "Previous line" },
	{ on = "j", run = "arrow next", desc = "Next line" },

	{ on = "<Up>",   run = "arrow prev", desc = "Previous line" },
	{ on = "<Down>", run = "arrow next", desc = "Next line" },

	# Filtering
	{ on = "f", run = "filter", desc = "Filter help items" },
